name: Validate spec

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint OpenAPI with Redocly
        run: npx @redocly/cli@1.34.5 lint openapi/partner-api.v1.yaml

  breaking-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract base spec
        id: base
        run: |
          if git show "origin/${{ github.base_ref }}:openapi/partner-api.v1.yaml" > base.yaml 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Diff against base for breaking changes
        if: steps.base.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: base.yaml
          revision: openapi/partner-api.v1.yaml
          fail-on: ERR
