          minimum: 5
          maximum: 600
        capacity:
          type: integer
          minimum: 1
          maximum: 500
        released_seats:
          type: integer
          minimum: 0
          maximum: 500
        discount_pct:
          type: integer
          minimum: 0
          maximum: 100
        instructor:
          type: string
          maxLength: 120
        room_name:
          type: string
          maxLength: 120
      example:
        external_id: studio-event-55012
        service_id: svc_abc
        date: 2026-10-25
        start_time: 18:30
        duration_min: 60
        capacity: 16
        released_seats: 4
        discount_pct: 50
        instructor: Anna K.
        room_name: Studio 2
    SlotUpdate:
      type: object
      properties:
        date:
          type: string
          format: date
        start_time:
          type: string
          pattern: ^([01]\\d|2[0-3]):[0-5]\\d$
        duration_min:
          type: integer
          minimum: 5
          maximum: 600
        capacity:
          type: integer
          minimum: 1
          maximum: 500
        released_seats:
          type: integer
          minimum: 0
          maximum: 500
        discount_pct:
          type: integer
          minimum: 0
          maximum: 100
        instructor:
          type: string
          maxLength: 120
        room_name:
          type: string
          maxLength: 120
      example:
        released_seats: 6
    BulkResult:
      type: object
      description: Per-row outcome of a POST /v1/schedule/bulk call. One row failing does not roll back
        the others.

      properties:
        summary:
          type: object
          properties:
            created:
              type: integer
            updated:
              type: integer
            failed:
              type: integer
            total:
              type: integer
        results:
          type: array
          items:
            type: object
            properties:
              external_id:
                type: string
              status:
                type: string
                enum:
                  - created
                  - updated
                  - error
              id:
                type: string
              error:
                $ref: "#/components/schemas/Error"
      example:
        summary:
          created: 1
          updated: 1
          failed: 0
          total: 2
        results:
          - external_id: studio-event-55012
            status: updated
            id: slot_xyz
          - external_id: studio-event-55013
            status: created
            id: slot_pqr
    Booking:
      type: object
      description: Privacy-safe projection — first name and a booking code only.
      properties:
        id:
          type: string
        studio_id:
          type: string
          description: The studio this record belongs to. A key can act on every studio of its business; see
            `GET /v1/studios`.
        confirmation_code:
          type: string
          example: A1B2C3
        status:
          type: string
          enum:
            - confirmed
            - cancelled
            - completed
        customer_first_name:
          type: string
        slot:
          type: object
          properties:
            id:
              type: string
            external_id:
              type:
                - string
                - "null"
            service_id:
              type: string
            date:
              type: string
              format: date
            start_time:
              type: string
        amount:
          type:
            - integer
            - "null"
          description: Minor units (grosze)
        currency:
          type:
            - string
            - "null"
        created_at:
